<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">🎬 Movie Explorer</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="search.html">Search</a>
            <a href="favorites.html">Favorites</a>
        </nav>
    </header>

    <main>

        <section class="favorites-section">

            <div class="section-header">
                <div>
                    <h1>My Favorites</h1>
                    <p>Movies you've saved for later.</p>
                </div>

                <button class="clear-favorites">Clear All</button>
            </div>

            <div class="favorite-movie-cards"></div>

            <div class="empty-favorites">
                <h2>No favorites yet</h2>
                <p>Start adding movies to your favorites and they'll appear here.</p>
                <a href="index.html">Discover Movies</a>
            </div>

        </section>

    </main>

    <script src="favorites.js"></script>
