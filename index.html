<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">🎬 Movie Explorer</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="search.html">Search</a>
            <a href="favorites.html">Favorites</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h1>Discover Your Next Movie</h1>

            <p>
                Explore popular and top-rated movies.
            </p>

            <a href="search.html" class="hero-button">
                Search Movies
            </a>

            <select>
                <option value="" selected disabled>Choose a genre</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Adventure">Adventure</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Thriller">Thriller</option>
                <option value="Mystery">Mystery</option>
                <option value="Animation">Animation</option>
            </select>
        </section>


        <section class="home-section">

            <div class="section-header">
                <h2>Popular Movies</h2>

            </div>

            <div class="home-movie-cards"></div>

        </section>


        <section class="home-section">

            <div class="section-header">
                <h2>Top Rated Movies</h2>
            </div>

            <div class="top-rated"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
